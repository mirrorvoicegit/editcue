/* 讓滑鼠選取與瀏覽器的文字範圍不受到其他工具干擾 */

#newTextNoteBtn{display:none!important}

/* EditCue Editorial — chrome is monochrome, semantics alone use fills. */
:root{--bg:#F4F4F2;--white:#FFF;--ink:#18191A;--muted:#797B7B;--edge:#DCDCD8;--accent:#18191A;--soft:#F4F4F2;--red:#B22C32;--redbg:#FFF;--violet:#5A468C;--blue:#18191A;--radius:4px;color-scheme:light}
html,body{background:var(--bg)!important;color:var(--ink)!important;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif!important;letter-spacing:.005em}
.shell{background:var(--bg)}
/* hairlines and folded corner: these are decorative, never interactive */
.header{height:72px;min-height:72px;background:#fff;color:#191919;border-bottom:1px solid #B8B9B6;padding:0 28px;gap:22px;position:relative}
.header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#202020 0 56px,#C8CAC7 56px 100%);pointer-events:none}
.brand{font-size:21px;font-weight:800;letter-spacing:-.7px;gap:12px;min-width:auto;color:#141414;white-space:nowrap}
.brand .micro{color:#858585;font-size:10px;letter-spacing:1px;font-weight:600;margin-left:3px;text-transform:uppercase}
.symbol{font-size:0!important;width:36px;height:36px;position:relative;border-radius:1px;background:#171818;clip-path:polygon(0 0,72% 0,100% 28%,100% 100%,0 100%);box-shadow:none}
.symbol::before{content:"";position:absolute;left:10px;top:11px;width:16px;height:13px;border-top:2px solid #fff;border-bottom:2px solid #fff;box-shadow:0 -5px 0 -3px #fff;pointer-events:none}
.symbol::after{content:"";position:absolute;right:0;top:0;width:10px;height:10px;background:linear-gradient(135deg,#F4F4F2 0 49%,#989A99 50%);pointer-events:none}
.titlefield{color:#262626;font-size:13px;font-weight:550;max-width:420px;letter-spacing:0;border-bottom:1px solid transparent;border-radius:0}
.titlefield:hover,.titlefield:focus{border-bottom-color:#313131}
.headright{gap:10px}
.headbtn{color:#242424;background:#fff;border:1px solid #BDBFBD;border-radius:3px;min-height:37px;height:37px;padding:0 15px;font-size:12px;font-weight:650;box-shadow:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.headbtn:hover{background:#F0F0ED;border-color:#777}
.headbtn.action,.headbtn.action:hover{background:#171818!important;border-color:#171818!important;color:#fff!important}
.headbtn.action:hover{background:#3C3D3C!important;transform:translateY(-1px)}
.headbtn.reset-btn{border:0;background:transparent;color:#707070}
.headbtn.reset-btn:hover{background:#F0F0ED;color:#181818}
.body{grid-template-columns:minmax(500px,1fr) minmax(285px,325px);gap:17px;padding:18px 22px 15px;background:var(--bg)}
.card{background:#fff;border:1px solid #CECFCC;border-radius:3px;box-shadow:0 2px 1px #00000005;}
.workspace{position:relative;isolation:isolate;overflow:hidden;border-color:#BFC0BC}
.workspace::after{content:"";position:absolute;z-index:8;bottom:0;right:0;width:24px;height:24px;background:linear-gradient(135deg, transparent 0 49%,#A6A7A4 50%,#E7E8E6 52%,#F8F8F8 100%);pointer-events:none;filter:drop-shadow(-2px -2px 1px #00000010)}
.toolbar{min-height:64px;padding:12px 17px;border-bottom:1px solid #D7D8D5;background:#fff}
.toolbar::before{content:"TRANSCRIPT  /  EDIT";display:block;position:absolute;right:42px;bottom:11px;font:600 8px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:2.1px;color:#B9BAB7;pointer-events:none;opacity:0}
.section-name{font-size:13px;font-weight:800;letter-spacing:.03em;color:#202020}
.count{font-size:11px;color:#8E8E8D;font-variant-numeric:tabular-nums}
.search{width:238px;height:36px;background:#F9F9F8;border:1px solid #E4E4E0;border-radius:3px;color:#222;font-size:12px;padding:0 13px;transition:border-color .15s,background .15s}
.search:focus{border-color:#555;background:#fff}
.search::placeholder{color:#9B9B9B}
.iconbtn,.undo-btn{color:#656767;border:1px solid transparent;border-radius:2px}
.iconbtn:hover,.undo-btn:hover:not(:disabled){background:#EEEDEA;color:#171818}
.transcript{background:#fff;padding:10px 15px 40px;scrollbar-color:#C8C9C6 transparent}
.txrow{grid-template-columns:90px minmax(0,1fr) 20px;gap:14px;border-radius:2px;padding:13px 15px;margin:3px 0;border:1px solid transparent;transition:background .13s ease,box-shadow .13s ease,border-color .13s ease}
.txrow:hover:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){background:#F6F6F4}
.txrow.selected:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){background:#F3F3F1;border-color:#888;outline:0;box-shadow:inset 3px 0 #282828}
.txrow.selected{outline:1px solid #777!important;outline-offset:-1px}
.time{color:#777A78;font:600 11.5px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:-.3px}
.line-number{color:#B1B2B0;font-size:10px;margin-top:3px}
.speech{font-size:16px;line-height:1.85;color:#1F2020;font-weight:450;letter-spacing:.015em}
.rowchev{color:#777}
/* exactly three fill meanings: cut, highlight, graphic range; everything else text only */
.txrow.mark-cut,.txrow.mark-cut:hover,.txrow.hasmarks.mark-cut{background:#E7E8E7!important;box-shadow:inset 4px 0 #7D7F7D!important}
.txrow.mark-cut .speech{text-decoration:line-through;text-decoration-color:#656866;text-decoration-thickness:1.4px;color:#656866}
.txrow.range-yellow:not(.mark-cut),.txrow.range-green:not(.mark-cut),.txrow.range-yellow:hover:not(.mark-cut),.txrow.range-green:hover:not(.mark-cut){background:#FFF26B!important;box-shadow:inset 4px 0 #C0A15C!important}
.txrow.range-highlight:not(.mark-cut):not(.range-yellow):not(.range-green),.txrow.range-highlight:hover:not(.mark-cut):not(.range-yellow):not(.range-green){background:#EAE7F5!important;box-shadow:inset 4px 0 #786999!important}
.txrow.range-special:not(.mark-cut):not(.range-highlight):not(.range-yellow):not(.range-green){background:#fff!important;box-shadow:none!important}
.txrow.graphic-separator:not(.mark-cut){border-top:2px dashed #937D51!important;border-radius:0 0 2px 2px!important;margin-top:0;padding-top:14px}
.txrow.hasmarks:not(.mark-cut):not(.range-yellow):not(.range-green):not(.range-highlight){box-shadow:none!important}
.txrow:has(.tag.highlight):not(.mark-cut):not(.range-highlight){box-shadow:none!important}
.txrow.range-preview{background:#FFF26B!important;box-shadow:inset 4px 0 #C0A15C!important}
.range-handle{border:1px solid #D9CDAA;border-radius:2px;background:#FFF8E4;color:#67552B;opacity:.75;font-size:17px;cursor:ns-resize}
.range-handle:hover{background:#FFF1CD;opacity:1}
/* no filled pills except actual duration bands */
.rowtags{gap:7px;align-items:center;margin-top:8px}
.tag,.tag:hover{background:transparent!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:0 5px 0 0;font-weight:770;font-size:11px;line-height:1.45;letter-spacing:.02em}
.tag::before{content:"▸";margin-right:5px;font-size:9px;vertical-align:1px}
.tag.cut{color:#525655!important}
.tag.highlight{color:#5D4D8E!important}
.tag.card,.tag.visual,.tag.textcard{color:#806329!important}
.tag.captions,.tag.other,.tag.move,.tag.short{color:#B12B32!important}
.cue-inline-note{background:transparent!important;border-left:2px solid #B12B32;color:#AB2B30;padding:3px 0 4px 10px;font-size:12px;line-height:1.7}
.cue-inline-image{border:1px solid #D8D8D4;border-radius:0}
.red-note{background:#fff!important;border:1px solid #DEDEDA!important;border-left:3px solid #BD2D32!important;border-radius:2px!important}
.red-note textarea{color:#B6232B;font-size:15px}
.add-red-note{display:none!important}
/* panels and cards: fine print, measured alignments, crop marks */
.asidecard{padding:15px 14px 12px}
#assetPanel{position:relative;border-color:#BFC0BC;isolation:isolate}
#assetPanel::before{content:"";position:absolute;right:0;top:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 0 46%,#B5B6B3 47% 51%,#F2F2F0 52%);pointer-events:none;z-index:2}
#assetPanel::after{content:"";position:absolute;right:25px;bottom:16px;width:9px;height:9px;border-left:1px solid #BDBEBB;border-top:1px solid #BDBEBB;pointer-events:none;opacity:.8}
.asidehead{padding-bottom:11px;margin-bottom:12px;border-bottom:1px solid #E5E5E1;align-items:center}
.asidehead h2{font-size:12px;font-weight:750;letter-spacing:.01em;color:#2A2A2A}
.countbadge{background:transparent;border:1px solid #DDDDDA;border-radius:1px;color:#838383;padding:3px 7px;font-size:10px}
.asset-add{width:30px;height:30px;background:#fff;border:1px solid #C9CBC8;border-radius:1px;color:#333;font-size:21px;transition:background .16s,border-color .16s}
.asset-add:hover{background:#F1F1EF;border-color:#3A3A3A}
.asset-add[data-tip]:hover:after{background:#191919;border-radius:2px;color:white}
.assetlist{gap:11px;grid-template-columns:repeat(2,minmax(0,1fr));padding:0 3px 4px 0}
.assetitem{padding:7px;border:1px solid #D8D9D7;border-radius:2px;background:#fff;position:relative;transition:border-color .16s ease,box-shadow .16s ease}
.assetitem::before{content:"";position:absolute;top:-1px;left:-1px;width:10px;height:10px;border-top:1px solid #A3A4A1;border-left:1px solid #A3A4A1;pointer-events:none}
.assetitem:hover{border-color:#292929;box-shadow:0 3px 12px #0000000d}
.assetitem.asset-used{background:white!important;border-color:#303230;box-shadow:inset 0 0 0 1px #303230}

<script>
'use strict';
const KINDS=[
{id:'cut',label:'剪掉',short:'刪除',help:'內容決策：刪除整段'},
{id:'move',label:'移位',short:'移位',help:'重新安排段落順序'},
{id:'card',label:'圖卡',short:'圖卡',help:'指定圖卡、圖片或畫面'},
{id:'captions',label:'特殊需求',short:'特殊',help:'特殊字幕與其他後製需求'},
{id:'highlight',label:'精彩片段',short:'精華',help:'節目精彩片段'},
{id:'short',label:'短影音',short:'短影音',help:'標記短影音可用段落'},
{id:'textcard',label:'插入字卡',short:'字卡',help:'影片中插入文字字卡'},

{id:'visual',label:'圖片畫面',short:'畫面',help:'照片或其他畫面'},
{id:'other',label:'其他說明',short:'其他',help:'其他特殊需求'}];
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',REL='http://schemas.openxmlformats.org/package/2006/relationships';
const $=id=>document.getElementById(id),enc=new TextEncoder();
const PRESET='一般口誤、停頓、重講、設備測試及場外對話由剪輯師按慣例整理；製作人僅標示內容取捨及特殊影像需求。';
let rows=[],annotations=[],assets=[],selected=new Set(),anchor=-1,kindId='card',editId=null,sourceName='',assetChoice='',draftRevision=0,saveTimer=null,processingFiles=false,dragCount=0;
let activeAssetDrag=false,rangeDrag=null,lastSelectionRect=null,suppressClickOnce=false,previewOpen=false;
let redNotes=[],referenceChoice='',referenceTemp=[],draggingNoteId='',undoStack=[],redoStack=[];
let reviewChecks={},reviewMode=false,reviewPendingOnly=false,reviewExpanded=new Set();
let searchRecords=[],searchActiveIndex=0,searchOpen=false,replaceExpanded=false,transcriptPointerRange=null;
const HISTORY_MAX=60;
function historySnapshot(){return JSON.stringify({annotations,redNotes,editedRows:rows.map(r=>({uid:r.uid,text:r.text,editedText:r.editedText}))});}
function updateUndoButtons(){if($('undoBtn'))$('undoBtn').disabled=!undoStack.length;if($('redoBtn'))$('redoBtn').disabled=!redoStack.length}
function pushUndo(){undoStack.push(historySnapshot());if(undoStack.length>HISTORY_MAX)undoStack.shift();redoStack=[];updateUndoButtons()}
function undoAction(){if(!undoStack.length)return;closeCueManager();redoStack.push(historySnapshot());const h=JSON.parse(undoStack.pop());annotations=h.annotations;redNotes=h.redNotes;if(h.editedRows){const byId=new Map(h.editedRows.map(r=>[r.uid,r]));for(const r of rows){const old=byId.get(r.uid);if(old){r.text=old.text;r.editedText=old.editedText}}}setSelection([]);refreshAll();markDirty();updateUndoButtons();toast('已復原')}
function redoAction(){if(!redoStack.length)return;undoStack.push(historySnapshot());const h=JSON.parse(redoStack.pop());annotations=h.annotations;redNotes=h.redNotes;if(h.editedRows){const byId=new Map(h.editedRows.map(r=>[r.uid,r]));for(const r of rows){const old=byId.get(r.uid);if(old){r.text=old.text;r.editedText=old.editedText}}}closeCueManager();setSelection([]);refreshAll();markDirty();updateUndoButtons();toast('已重做')}
function newCueId(){return 'cue'+Date.now()+Math.random().toString(36).slice(2)}
function rowIsCut(uid){return annotations.some(a=>a.kind==='cut'&&a.rowIds.includes(uid))}
function rowIsShort(uid){return !rowIsCut(uid)&&annotations.some(a=>a.kind==='short'&&a.rowIds.includes(uid))}
function cueRangeLabel(a){
 const x=sourceRowAt(a),code=a.assetId?(window._exportCodes?.get(a.assetId)||assetById(a.assetId)?.code||''):'';
 const title=a.kind==='short'?'短影音範圍':a.kind==='highlight'?'精彩片段':a.kind==='card'?'圖卡':a.kind==='textcard'?'字卡':findKind(a.kind).label;
 const serial=x?(String(x.first.seq||x.firstIndex+1)+(x.firstIndex===x.lastIndex?'':'–'+String(x.last.seq||x.lastIndex+1))):'?';
 return title+(code?' · '+code:'')+'　字幕 '+serial+'　'+prettyText(a);
}



// 保留原稿本體，匯出時僅附加標示，不重建段落或合併字幕。
let sourceType='',sourceRawText='',originalDocxBase64='',originalSubtitleBase64='';
const safeText=s=>String(s??'');
function escapeHtml(s){return safeText(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escXml(s){return safeText(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&apos;')}
function cleanFileName(s){return safeText(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').slice(0,80)||'EditCue'}
function asClock(t){return (t||'').replace(',', '.').replace(/^00:/,'')}
function toast(s){const el=$('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>el.classList.add('hidden'),3000)}
function download(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)}
function findKind(id){return KINDS.find(x=>x.id===id)||({id,label:id==='keep'?'特別保留':'其他需求',short:'其他'})}
function assetById(id){return assets.find(a=>a.id===id)}
function imageFormat(s){return (s||'').match(/^data:(image\/(?:png|jpeg|webp));base64,/)?.[1]||'image/png'}
function nextAssetCode(){let n=1;while(assets.some(x=>x.code==='G'+String(n).padStart(2,'0')))n++;return 'G'+String(n).padStart(2,'0')}
function prettyText(a){const i=rows.find(r=>r.uid===a.rowIds[0]),j=rows.find(r=>r.uid===a.rowIds.at(-1));return i?.start?asClock(i.start)+'–'+asClock(j?.end):'Lines '+(i?.seq||'?')+'–'+(j?.seq||'?')}
function serializable(){return{app:'EditCue',version:'1.0',title:$('docTitle').value||'未命名節目',sourceName,sourceType,sourceRawText,originalDocxBase64,originalSubtitleBase64,rows,assets,annotations,redNotes,reviewChecks,preset:PRESET}}
function markDirty(){draftRevision++;$('saveStatus').textContent='正在儲存到本機…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await saveLocal(serializable());$('saveStatus').textContent='已儲存於本機 · 未上傳檔案'}catch(e){console.warn(e);$('saveStatus').textContent='自動儲存未啟用 · 請下載專案檔'}},750)}

let jumpTimer=null;
function jumpToSubtitle(number){
 const raw=String(number??'').trim();
 if(!/^\d{1,6}$/.test(raw)){toast('請輸入逐字稿左側的字幕編號');return false}
 if(!rows.length){toast('請先上傳逐字稿');return false}
 const target=Number(raw),indices=rows.map((r,i)=>Number(r.seq||i+1)===target?i:-1).filter(i=>i>=0);
 if(indices.length!==1){toast(indices.length?'這個字幕編號重複，無法精確跳轉':`找不到字幕編號 ${target}`);return false}
 // 搜尋篩選可能讓字幕從畫面消失；跳轉時先恢復完整逐字稿。
 if($('searchInput').value.trim()){$('searchInput').value='';searchOpen=false;replaceExpanded=false;searchActiveIndex=0;recomputeSearchRecords();refreshSearchPanel();renderRows()}
 document.querySelectorAll('.txrow.jump-target').forEach(el=>el.classList.remove('jump-target'));
 const i=indices[0],el=$('transcript').querySelector(`.txrow[data-i="${i}"]`);
 if(!el){toast('暫時無法定位這段字幕');return false}

function recomputeSearchRecords(){

 if(!q||/^\d{1,6}$/.test(q))return;
 const needle=q.toLocaleLowerCase();
 rows.forEach((r,rowIndex)=>{
  const hay=String(r.text||'').toLocaleLowerCase();let pos=0;
  while(pos<hay.length){const start=hay.indexOf(needle,pos);if(start<0)break;
   searchRecords.push({rowIndex,start,end:start+q.length});pos=start+Math.max(1,q.length);
  }
 });
 searchActiveIndex=Math.max(0,Math.min(searchActiveIndex,Math.max(0,searchRecords.length-1)));
}

 for(const m of matches){html+=escapeHtml(text.slice(pos,m.start));
  html+=`<span class="search-match${m.index===searchActiveIndex?' active':''}" data-search-match="${m.index}">${escapeHtml(text.slice(m.start,m.end))}</span>`;
  pos=m.end;

}

 const previous=new Map(indices.size?Array.from(indices,i=>[i,rows[i].text]):[]);
 const changed=new Map();
 if(all){
  const escaped=needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(escaped,'gi');
  for(const [i,original] of previous){const next=original.replace(re,()=>replacement);if(next!==original)changed.set(i,next)}
 }else{
  const rec=targets[0],original=rows[rec.rowIndex].text;
  const next=original.slice(0,rec.start)+replacement+original.slice(rec.end);
  if(next!==original)changed.set(rec.rowIndex,next);

 if(!changed.size){toast('取代文字與原文相同');return}

 for(const [i,value] of changed){const r=rows[i];r.originalText??=r.text;r.text=value;r.editedText=value;}

 // 全部取代後直接顯示修正後的文字，避免因舊關鍵字消失而出現空白頁。

function reviewEntries(){
 const out=[];
 for(const cue of noteOrder()){
  const range=sourceRowAt(cue);if(!range)continue;
  const graphic=['card','visual'].includes(cue.kind),asset=assetById(cue.assetId),reference=assetById(cue.referenceAssetId);
  const file=graphic&&asset?'圖卡_'+String(deliveryAssetNumber(cue)).padStart(3,'0')+'.png':'';
  const name=graphic?'插入圖卡':cue.kind==='textcard'?'插入字卡':cue.kind==='captions'?'特殊需求':cue.kind==='other'?'其他備註':findKind(cue.kind).label;
  const first=String(range.first.seq||range.firstIndex+1),last=String(range.last.seq||range.lastIndex+1);
  out.push({key:'cue:'+cue.id,
   signature:JSON.stringify([cue.kind,cue.rowIds,cue.title||'',cue.detail||'',cue.assetId||'',cue.referenceAssetId||'',cue.selectedQuote||'',asset?.name||'',reference?.name||'']),
   at:range.firstIndex*2,kind:cue.kind,
   name:name+(file?'｜'+file:''),number:'字幕 '+first+(first!==last?'–'+last:''),
   startNumber:first,endNumber:last,startTime:range.first.start||'',endTime:range.last.end||'',
   startText:String(range.first.editedText??range.first.text??'').trim(),endText:String(range.last.editedText??range.last.text??'').trim(),
   pointOnly:false,
   detail:(cue.detail||(!cue.assetId?cue.title:'')||'').trim(),
   quote:range.first.text||'',image:asset?.dataUrl||reference?.dataUrl||'',imageName:asset?.name||reference?.name||'',imageAssetId:asset?.id||reference?.id||''});
 }
 for(const note of redNotes){
  if(!(note.text||'').trim())continue;
  const idx=rows.findIndex(r=>r.uid===note.afterUid),row=rows[idx];
  out.push({key:'note:'+note.id,signature:JSON.stringify([note.afterUid||'',note.text||'']),
   at:idx<0?-1:idx*2+1,kind:'other',name:'其他備註',
   number:row?'字幕 '+(row.seq||idx+1)+' 後':'開頭',
   startNumber:row?String(row.seq||idx+1):'',endNumber:'',startTime:row?.end||row?.start||'',endTime:'',
   startText:'',endText:'',pointOnly:true,
   detail:note.text||'',quote:'',image:'',imageName:'',imageAssetId:''});
 }
 return out.sort((a,b)=>a.at-b.at||a.key.localeCompare(b.key));
}

  $(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',String(on));

  const checked=isReviewChecked(x),palette=reviewKindColor(x.kind),expanded=reviewExpanded.has(x.key);

async function importPptx(file){if(file.size>120*1024*1024)throw Error('簡報超過120MB，請先分成較小檔案');

 try{await ensurePptModule();const canvas=document.createElement('canvas');canvas.width=1920;canvas.height=1080;
 const viewer=new window.PptxViewJS.PPTXViewer({canvas,autoExposeGlobals:true});await viewer.loadFile(file);const count=viewer.getSlideCount();
 if(!count||count>150)throw Error('投影片數量不支援（1～150頁）');let converted=0,failures=[];
 for(let i=0;i<count;i++){status.textContent=`${file.name} · 正在轉換第 ${i+1} / ${count} 頁`;
 try{await viewer.renderSlide(i,canvas);await new Promise(ok=>requestAnimationFrame(()=>requestAnimationFrame(ok)));
 if(!canvas.width||!canvas.height)throw Error('畫布是空的');
 const png=document.createElement('canvas');png.width=1920;png.height=1080;const g=png.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,1920,1080);

 assets.push({needsReview:suspiciousRepeat,id:'ppt'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2),code:nextAssetCode(),name:file.name.replace(/\.pptx$/i,'')+' · 第'+(i+1)+'頁',fileName:file.name,dataUrl,width:1920,height:1080,pptSource:file.name,slideNumber:i+1});converted++;
 }catch(e){console.warn('第'+(i+1)+'頁轉換失敗',e);failures.push(i+1)}

 renderAssets();markDirty();focusNewAsset(assets.at(-1)?.id);status.textContent=`${file.name} · 已加入 ${converted}/${count} 頁`+(failures.length?' · 轉換失敗頁：'+failures.join('、'):'')+' · 注意：PPT 瀏覽器轉圖可能與原稿不同；正式圖卡建議改用 PDF 或 PNG';

}

function parseTimeRange(s){const m=s.match(/((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})/);return m?{start:m[1],end:m[2]}:null}

  let p=paras[i],s=(p.text||'').trim(), imgs=p.images||[];

  // 格式甲：字幕編號、時間碼、台詞分開三個段落。
  if(/^\d{1,6}$/.test(s)&&paras[i+1]&&parseTimeRange(paras[i+1].text||'')){
   let t=parseTimeRange(paras[i+1].text),p2=paras[i+2];let speech=(p2?.text||'').trim();
   if(speech&&!parseTimeRange(speech)&&!/^\d+$/.test(speech)){rows.push(makeRow(s,t,speech,'',imgs.concat(p2.images||[]),[i,i+1,i+2]));i+=2}
   else {rows.push(makeRow(s,t,'','',imgs,[i,i+1]));i+=1}continue;
  }
  // 格式乙：同一段落包含字幕編號、時間碼和台詞。
  const full=s.match(/^(\d{1,6})\s+((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})\s*-->\s*((?:\d{2}:)?\d{2}:\d{2}[.,]\d{3})(?:\s+(.*))?$/);
  if(full){rows.push(makeRow(full[1],{start:full[2],end:full[3]},full[4]||'', '', imgs,[i]));continue}

  const range=parseTimeRange(s);
  if(range&&/^\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}/.test(s)){
    let suffix=s.replace(/^.*?-->\s*(?:\d{2}:)?\d{2}:\d{2}[.,]\d{3}\s*/,'');

  rows=paras.filter(p=>(p.text||'').trim()||(p.images||[]).length).map((p,i)=>makeRow(i+1,null,(p.text||'').trim(),'',p.images||[],[i]));

}

// 嚴格保留原稿：字幕原始行數、文字、時間碼與順序不變，只增加顏色和獨立指示行。

let cachedNoteOrder=null;

  ?'【字幕 '+startSeq+(first.firstIndex===first.lastIndex?'':'–'+endSeq)+'｜'+first.first.start+' → '+first.last.end+'】'
  :'【字幕 '+startSeq+' 起｜'+first.first.start+'】';

  const range=ranges[i],end=range?.last;

function identicalCue(kind,ids,assetId=''){

function splitContiguousCue(a,ids){

 const ordered=[...new Set(ids)].map(id=>({id,index:rows.findIndex(r=>r.uid===id)})).filter(x=>x.index>=0).sort((x,y)=>x.index-y.index);
 const groups=[];for(const item of ordered){const last=groups.at(-1);if(last?.length&&item.index===last.at(-1).index+1)last.push(item);else groups.push([item]);}

function replaceExcludedIds(blockedIds){

 const start=seqIndex.get(from),end=seqIndex.get(to);

 if(start>end){base.errors.push('這份逐字稿的字幕編號順序不正確');return base}
 base.start=start;base.end=end;base.ids=rows.slice(start,end+1).map(r=>r.uid);
 const action=m[3].trim();
 const names=[['插入圖卡','card'],['插入圖片','card'],['圖卡','card'],['圖片','card'],['插入字卡','textcard'],['字卡','textcard'],['精彩片段','highlight'],['精華片段','highlight'],['精彩','highlight'],['短影音','short'],['剪掉','cut'],['刪除','cut'],['特殊需求','captions'],['其他備註','other']];
 const found=names.find(([label])=>action===label||action.startsWith(label+' ')||action.startsWith(label+'：')||action.startsWith(label+':'));
 if(!found){base.errors.push('不支援的標示種類；請使用剪掉、圖卡、字卡、精彩片段、短影音或特殊需求');return base}

function prepareFastMarkPlans(){

 if(commands.length>80)plans.push({lineNumber:81,raw:'…',errors:['一次最多輸入 80 則，請分批操作'],warnings:[]});
 // 批次內衝突提前攔下，避免一筆剪掉覆蓋另一筆新建的圖卡或字卡。
 for(let i=0;i<plans.length;i++){const a=plans[i];if(a.errors?.length||!a.ids)continue;
  for(let j=0;j<i;j++){const b=plans[j];if(b.errors?.length||!b.ids)continue;
   const intersect=a.start<=b.end&&b.start<=a.end;if(!intersect)continue;
   if((a.kind==='cut'&&b.kind!=='cut')||(b.kind==='cut'&&a.kind!=='cut'))a.errors.push('與第 '+b.lineNumber+' 行的標示衝突：剪掉不可與其他需求重疊');
   else if(a.kind===b.kind&&a.start===b.start&&a.end===b.end){a.skip=true;a.warnings.push('與第 '+b.lineNumber+' 行完全相同，將略過重複輸入')}

async function attachReferenceFiles(incoming){
 const files=Array.from(incoming||[]).filter(Boolean);
 if(!files.length){referenceFeedback('沒有收到圖片檔案，請使用 PNG、JPG 或其他常見圖片格式',true);return false}
 const images=files.filter(f=>imageFileSupported(f));
 if(!images.length){referenceFeedback('這裡只能使用圖片，請選取 JPG、PNG 或 WebP 等圖片檔案',true);return false}
 const old=preserveInspectorInputs();
 try{
  const added=await addAssets(images);
  if(!added.length){referenceFeedback('圖片無法讀取，請試著另存為 JPG 或 PNG',true);return false}
  referenceChoice=added.at(-1).id;
  renderInspector();restoreInspectorInputs(old);
  referenceFeedback('已加入 '+added.length+' 張參考圖片，儲存標示後會連同說明一起保留');
  return true;
 }catch(e){console.error('參考圖片加入失敗',e);referenceFeedback('圖片加入失敗：'+e.message,true);return false}
}
async function attachReferenceAsset(id){

async function pasteReferenceFromClipboard(){

 if(!navigator.clipboard?.read){$('referenceDrop')?.focus();referenceFeedback('請複製圖片，點一下虛線框，再按 Ctrl+V 貼上');return}
 try{
  const items=await navigator.clipboard.read();const files=[];
  for(const item of items){for(const type of item.types.filter(t=>t.startsWith('image/'))){
    const blob=await item.getType(type);const extension=type.includes('jpeg')?'jpg':type.split('/')[1].split('+')[0];
    files.push(new File([blob],'貼上參考圖_'+(files.length+1)+'.'+extension,{type}));break;
  }}
  if(!files.length){$('referenceDrop')?.focus();referenceFeedback('剪貼簿裡沒有圖片，請先複製圖片再按 Ctrl+V',true);return}
  await attachReferenceFiles(files);
 }catch(e){$('referenceDrop')?.focus();referenceFeedback('無法直接讀取剪貼簿，請點選虛線框後按 Ctrl+V 貼上',true)}
}

function positionSelectionTools(){
 requestAnimationFrame(()=>{
  const bar=$('toolBar');if(!bar.classList.contains('open'))return;
  // 選取多行時文字範圍可能超出可視區，優先採用第一個可見的字幕位置。
  const visible=selectionIndices().map(i=>$('transcript').querySelector(`.txrow[data-i="${i}"]`)).filter(Boolean);
  const viewport=$('transcript').getBoundingClientRect();
  const first=visible.find(el=>{const r=el.getBoundingClientRect();return r.bottom>viewport.top+12&&r.top<viewport.bottom-12;})||visible[0];
  const fallback=first?.getBoundingClientRect()||lastSelectionRect||viewport;
  const w=Math.min(bar.offsetWidth||530,window.innerWidth-16),h=bar.offsetHeight||42;
  const x=Math.min(window.innerWidth-w-8,Math.max(8,fallback.left));
  const idealTop=fallback.top-h-9;
  const alternateTop=fallback.bottom+9;
  const y=idealTop>=8?idealTop:Math.min(window.innerHeight-h-8,alternateTop);
  bar.style.left=Math.max(8,x)+'px';
  bar.style.top=Math.max(8,Math.min(window.innerHeight-h-8,y))+'px';
 });
}
function positionInspector(){
 const rect=lastSelectionRect;
 const el=$('inspector');
 const x=rect?rect.left:100,y=rect?.bottom||150;
 el.style.left=Math.max(12,Math.min(window.innerWidth-el.offsetWidth-14,x))+'px';
 // 先算內容真正高度，才能避免右下角的儲存按鈕被視窗底部裁掉。
 const usableHeight=Math.max(230,window.innerHeight-96);
 const panelHeight=Math.min(el.scrollHeight||480,usableHeight);
 const maxTop=Math.max(68,window.innerHeight-panelHeight-15);
 el.style.top=Math.max(68,Math.min(maxTop,y+9))+'px';
}
