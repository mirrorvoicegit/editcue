<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>EditCue｜剪輯師版示範</title><script src="../editor-view.js"></script><script>
const lines=['這次街訪，我們去了市場。','我們先看這張地圖。','訪問從北門這一側開始。','等一下，這句我重講。','第一攤是每天清晨開門的早餐店。','老闆說，熟客聽聲音就知道他來了。','這是我最想留下的一句話。'];
const demoRows=lines.map((text,i)=>({uid:'demo'+i,seq:i+1,text,start:'00:00:'+String(i*5).padStart(2,'0')+'.000',end:'00:00:'+String(i*5+5).padStart(2,'0')+'.000'}));
const cue=(id,kind,indices,extra={})=>({id,kind,rowIds:indices.map(i=>demoRows[i].uid),...extra});
const demo={title:'剪輯示範｜市場街訪',rows:demoRows,annotations:[cue('a','card',[1,2],{detail:'顯示市場地圖，標出北門入口。'}),cue('b','cut',[3]),cue('c','textcard',[4],{detail:'清晨五點，市場開門'}),cue('d','highlight',[5]),cue('e','short',[5,6],{shortOrder:0}),cue('f','short',[0],{shortOrder:1})],shortTitle:'早餐店還沒開門，熟客怎麼知道老闆來了？'};

document.open();document.write(buildEditorPage(demo));document.close();
</script></html>
