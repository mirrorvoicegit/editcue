name: Generate EditCue guide PDF
on:
  push:
    branches: [main]
    paths:
      - guide.html
      - .github/workflows/guide-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font and PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install weasyprint
      - name: Convert public guide page to PDF
        run: |
          python - <<'PY'
          from weasyprint import HTML
          HTML(filename="guide.html").write_pdf("guide.pdf")
          PY
          test -s guide.pdf
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate guide PDF"
            git push
          fi
